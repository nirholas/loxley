[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
cbor_metadata = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
rhc = "${RHC_MAINNET_RPC_URL}"
rhc_testnet = "${RHC_TESTNET_RPC_URL}"

[fmt]
line_length = 120
